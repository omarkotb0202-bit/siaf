services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: safa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["safa_pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safa"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  safa_pg_data:
